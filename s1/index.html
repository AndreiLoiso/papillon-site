<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E6F6A">
<title>Papillon · Săptămâna 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF2EE; --surface:#FFFFFF; --ink:#1B2A29; --muted:#566866; --line:#D3DDD8;
  --accent:#1E6F6A; --accent-ink:#FFFFFF; --accent-soft:#DCEEEB;
  --leaf:#8DB63A; --leaf-soft:#EAF3D2;
  --tip:#FBF1D4; --tip-ink:#5A4509; --short:#E3F0E4; --short-ink:#26502C;
  --danger:#A23B2F;
  --shadow:0 1px 2px rgba(20,40,38,.06),0 6px 18px rgba(20,40,38,.05);
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
:root[data-theme="dark"]{
  --bg:#0E1718; --surface:#162324; --ink:#E5EEEB; --muted:#90A7A3; --line:#26393A;
  --accent:#5EC4B8; --accent-ink:#06201D; --accent-soft:#1B3836;
  --leaf:#A8CC4A; --leaf-soft:#27331A;
  --tip:#2D2A14; --tip-ink:#E8D79A; --short:#17301E; --short-ink:#B5DDB9;
  --danger:#E0857A;
  --shadow:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1718; --surface:#162324; --ink:#E5EEEB; --muted:#90A7A3; --line:#26393A;
    --accent:#5EC4B8; --accent-ink:#06201D; --accent-soft:#1B3836;
    --leaf:#A8CC4A; --leaf-soft:#27331A;
    --tip:#2D2A14; --tip-ink:#E8D79A; --short:#17301E; --short-ink:#B5DDB9;
    --danger:#E0857A; --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.2;margin:0 0 .4em;letter-spacing:-.005em}
h1{font-size:1.7rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
p{margin:0 0 .8em}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:640px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:600 1.1rem var(--serif);text-decoration:none;color:var(--ink)}
.brand small{font:500 .8rem var(--sans);color:var(--muted);margin-left:2px}
.spacer{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--ink)}
.testbadge{font-size:.72rem;background:var(--leaf-soft);color:var(--ink);border:1px solid var(--leaf);padding:2px 8px;border-radius:999px}

main{max-width:640px;margin:0 auto;padding:18px 16px 110px}
.view>*+*{margin-top:14px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;text-decoration:none;color:var(--muted);font-size:.74rem;font-weight:500}
.nav a svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--accent);font-weight:700}
.nav a[aria-current="page"] svg{stroke-width:2.3}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card h2,.card h3{margin-bottom:.3em}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{font-size:.78rem;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--ink);border:1px solid transparent}
.chip.ghost{background:none;border-color:var(--line);color:var(--muted)}

/* hero + caterpillar */
.hero{padding:18px 16px 12px;border-radius:20px;background:linear-gradient(180deg,var(--leaf-soft),var(--surface) 85%);border:1px solid var(--line)}
.hero h1{margin-bottom:.1em}
.hero .sub{color:var(--muted);margin-bottom:6px}
.cat{width:100%;height:auto;display:block;margin:4px 0 0}
.cat .head{fill:var(--leaf)}
.cat .eye{fill:var(--ink)}
.cat .smile,.cat .ant{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-linecap:round}
.cat .seg{cursor:pointer}
.cat .ring{fill:var(--surface);stroke:var(--line);stroke-width:2.5}
.cat .fill{fill:var(--leaf)}
.cat .sel .ring{stroke:var(--accent);stroke-width:4}
.cat .dn{fill:var(--muted);font:600 11px var(--sans);text-anchor:middle}
.cat .sel .dn{fill:var(--accent)}
.cat .td{fill:var(--accent)}
.daylabel{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.daylabel b{font:600 1.05rem var(--serif)}

/* moment sections */
.moment-h{display:flex;align-items:baseline;gap:8px;margin:0 0 4px}
.moment-h small{color:var(--muted)}
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row b{font-weight:600;display:block;line-height:1.3}
.row small{color:var(--muted)}
.check{appearance:none;-webkit-appearance:none;width:26px;height:26px;flex:none;border:2px solid var(--muted);border-radius:8px;background:var(--surface);display:grid;place-items:center;cursor:pointer;margin:0}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:6px;height:12px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.go{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--muted);text-decoration:none;flex:none}
.go svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row.done b{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.mini{display:flex;gap:6px;align-items:center;color:var(--muted)}
.mini svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.mini .on{color:var(--accent)}

.summary{display:flex;gap:10px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font:600 1.5rem var(--serif)}
.stat span{font-size:.82rem;color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none}
.btn.ghost{background:none;color:var(--accent)}
.btn.small{min-height:36px;padding:0 12px;font-size:.9rem}
.btn.danger{border-color:var(--danger);color:var(--danger);background:none}
.btns{display:flex;flex-wrap:wrap;gap:8px}

/* media slots */
.slot{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.slot-h{display:flex;align-items:center;gap:10px}
.slot-h svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--accent);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.slot-h b{display:block;line-height:1.2}
.slot-h small{color:var(--muted)}
.slot.empty{border-style:dashed;background:transparent}
.slot.empty .slot-h svg{stroke:var(--muted)}
.slot audio{width:100%}
.slot video,.slot iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000}
.adm{display:flex;gap:6px}
.adm input{flex:1;min-width:0}

/* steps and boxes */
.steps{list-style:none;counter-reset:s;padding:0;margin:8px 0 0}
.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px}
.steps li::before{content:counter(s);position:absolute;left:0;top:8px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--ink);font-weight:700;font-size:.9rem;display:grid;place-items:center}
.box{border-radius:14px;padding:12px 14px}
.box b{display:block;margin-bottom:2px}
.box.tip{background:var(--tip);color:var(--tip-ink)}
.box.short{background:var(--short);color:var(--short-ink)}
.box.ex{border:1px solid var(--line);font-style:italic}
.bullets{margin:6px 0 0;padding-left:20px}
.bullets li{margin:4px 0}

/* timer */
.timer{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.timer .tt{font:600 1.7rem var(--serif);min-width:4.2ch;font-variant-numeric:tabular-nums}

/* forms */
label.f{display:block;font-weight:600;font-size:.95rem;margin:12px 0 4px}
textarea,input[type=text],input[type=date],input[type=number],select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:44px}
textarea{min-height:76px;resize:vertical;line-height:1.45}
.q{margin-top:12px}
.q label{font-weight:600;display:block;margin-bottom:4px}
.q .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);font-size:.82rem;margin-right:8px}
.grat{display:grid;gap:8px}
.saved{font-size:.8rem;color:var(--muted)}

/* segmented tabs */
.seg-tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg-tabs button{flex:1;border:0;background:none;border-radius:9px;min-height:38px;cursor:pointer;color:var(--muted);font-weight:600}
.seg-tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* radar */
.radar{width:100%;height:auto;display:block}
.radar .ring{fill:none;stroke:var(--line);stroke-width:1}
.radar .axis{stroke:var(--line);stroke-width:1}
.radar .poly{fill:color-mix(in srgb,var(--accent) 28%,transparent);stroke:var(--accent);stroke-width:2.2}
.radar .dot{fill:var(--accent)}
.radar text{fill:var(--ink);font:500 10.5px var(--sans)}
.dom{padding:10px 0;border-top:1px solid var(--line)}
.dom:first-child{border-top:0}
.dom-top{display:flex;gap:8px;align-items:center}
.dom-top input[type=text]{flex:1;min-height:38px;padding:6px 10px}
.dom-v{font:600 1.2rem var(--serif);width:2ch;text-align:right}
input[type=range]{width:100%;accent-color:var(--accent);margin:8px 0 2px}
.dom .note{margin-top:6px}

/* theory */
.tcard{display:block;text-decoration:none;color:inherit}
.tcard h3{margin-bottom:2px}
.lead{font:500 1.05rem/1.4 var(--serif);color:var(--muted);margin-bottom:10px}
.band{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.band div{background:var(--leaf-soft);border-radius:12px;padding:10px;text-align:center}
.band b{display:block;font-family:var(--serif)}
.band span{font-size:.82rem;color:var(--muted)}
.weeks{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.weeks li{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:10px;font-size:.92rem;color:var(--muted)}
.weeks li b{width:3.4ch;color:inherit}
.weeks li.now{background:var(--accent-soft);color:var(--ink);font-weight:600}
.pager{display:flex;justify-content:space-between;gap:8px}

/* feedback */
.rate{display:flex;gap:6px}
.rate button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.fbq{display:flex;gap:8px;margin:8px 0}
.fbq button{flex:1;min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;font-weight:600}
.fbq button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.hist details{border-top:1px solid var(--line);padding:8px 0}
.hist summary{cursor:pointer;font-weight:600}
.hist p{margin:6px 0 0}

/* dialog + toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,20,20,.55);display:grid;place-items:center;padding:16px}
.overlay[hidden]{display:none}
.overlay .dlg{background:var(--surface);color:var(--ink);border-radius:20px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.dlg{padding:22px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:.9rem;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* notițe de revizuire (pentru Adela) */
.review{margin-top:28px;padding:16px;border-radius:16px;border:2px dashed #C9871A;background:var(--tip);color:var(--tip-ink)}
.review h2{font-size:1.1rem;margin-bottom:.3em}
.review textarea{background:var(--surface);color:var(--ink)}
.review .btn{border-color:#9C6A12;background:#9C6A12;color:#fff}
.review .btn.ghost{background:none;color:inherit;border-color:#9C6A12}

.tprog{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;margin-top:14px}
.tprog .grow{flex:1;min-width:0}.tprog b{display:block}.tprog small{color:var(--muted)}
.tprog>svg{width:20px;height:20px;color:var(--muted);flex:none}
.tchecks{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.chk{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:500}
.okbadge{display:inline-block;font:600 .72rem var(--sans,inherit);padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--accent-ink);vertical-align:middle;margin-left:6px}
.okbadge.half{background:var(--tip);color:var(--tip-ink)}

</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/azi">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 15c-3-8-10-10-13-7-2 3 1 9 6 10-4 1-5 6-2 8 3 2 7-1 9-5z" fill="#8DB63A"/><path d="M16 15c3-8 10-10 13-7 2 3-1 9-6 10 4 1 5 6 2 8-3 2-7-1-9-5z" fill="#1E6F6A"/><rect x="15" y="9" width="2" height="16" rx="1" fill="currentColor"/></svg>
    Papillon <small>Săptămâna 1</small>
  </a>
  <span class="testbadge">versiune de test</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="themeBtn" aria-label="Schimbă tema luminos / întunecat"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
</div></header>
<main><div id="view" class="view" aria-live="polite"></div></main>
<nav class="nav" aria-label="Navigare principală"><div class="nav-in" id="nav"></div></nav>
<div class="toast" id="toast" role="status"></div>
<div id="welcome" class="overlay" role="dialog" aria-modal="true" aria-label="Bun venit" hidden></div>
<div id="fatal" hidden style="position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#fff3f0;color:#7a1f14;border:1px solid #d9806f;border-radius:10px;padding:10px;font:13px/1.4 system-ui"></div>
<script>
window.addEventListener("error",function(e){var f=document.getElementById("fatal");if(f){f.hidden=false;f.textContent="Eroare: "+(e.message||e.error)+" ("+(e.lineno||"")+")";}});
/* ============================================================
   Papillon · Săptămâna 1 — conținut și configurare
   Aici se editează: linkurile media (MEDIA), adresa scriptului de feedback,
   textele exercițiilor și ale teoriei.
   ============================================================ */

const CONFIG = {
  version: 'S1-test-0.1',
  // Adresa web a scriptului Google Apps Script care primește feedback-ul (vezi apps-script/Code.gs).
  // Lasă gol → feedback-ul se copiază / se descarcă. Adresele de email stau doar în script, nu aici.
  feedbackUrl: 'https://script.google.com/macros/s/AKfycbzW6imOycsVBO2QaOI-jneF4FxaKdrB49qaWJbiIMmI6uD4WRSIpJDQIcbFjug9eRat/exec',
  // Mod revizuire: afișează câmpul „Pentru Adela” la finalul fiecărei pagini. După aprobare: false.
  reviewMode: true,
};

/* ---- MEDIA -------------------------------------------------
   Pentru fiecare exercițiu / concept: audio (instrucțiuni) și video (explicații).
   Acceptă: link YouTube / Vimeo, fișier .mp4/.webm, fișier .mp3/.m4a,
   sau cale relativă (ex. 'media/impamantare.mp3').
   Gol ('') → clientul vede „Disponibil în curând".
   Pentru test rapid fără a edita fișierul: deschide aplicația cu ?admin=1
   ------------------------------------------------------------ */
const MEDIA = {
  'impamantare':      { audio: '', video: '' },
  'curatare':         { audio: '', video: '' },
  'superman':         { audio: '', video: '' },
  'plimbare':         { audio: '', video: '' },
  'detaliu':          { audio: '', video: '' },
  'intrebari-seara':  { audio: '', video: '' },
  'roata':            { audio: '', video: '' },
  'obiective':        { audio: '', video: '' },
  'a-fi':             { audio: '', video: 'https://www.youtube.com/watch?v=j7g9FqFgOSA' },
  'a-fi-liber':       { audio: '', video: '' },
  'a-fi-magic':       { audio: '', video: '' },
  'creator-vreator':  { audio: '', video: '' },
};

const MOMENTS = {
  dimineata: { label: 'Dimineața', sub: 'Corpul' },
  ziua:      { label: 'Ziua',      sub: 'Sufletul' },
  seara:     { label: 'Seara',     sub: 'Mintea' },
  punctual:  { label: 'O singură dată', sub: 'Punctual' },
};

/* ---- EXERCIȚII --------------------------------------------- */
const EX = [
  {
    id: 'impamantare', title: 'Împământare / conectare ancestrală',
    moment: 'dimineata', pilon: 'Corp', cat: 'Energetic', min: 3, freq: 'zilnic',
    scop: 'Reconectarea conștientă cu energia Pământului chiar la începutul zilei, ca ancoră fizică și energetică înaintea oricărei alte acțiuni. În paralel, exercițiul te leagă simbolic de linia ta ancestrală — de tot ce a venit înaintea ta și te susține, chiar dacă nu vezi asta.',
    pasi: [
      'Stai în picioare, desculț dacă poți (pe podea, iarbă sau pământ).',
      'Închide ochii și imaginează-ți rădăcini care coboară din tălpile tale spre centrul Pământului.',
      'Respiră adânc de 2–3 ori, simțind cum, cu fiecare expir, „cobori" rădăcinile mai adânc.',
      'Rostește, în gând sau cu voce joasă, o intenție scurtă de conectare cu linia ta ancestrală — de exemplu: „Mă conectez la forța celor dinaintea mea."',
      'Rămâi 30–60 de secunde în această stare, simțind stabilitatea.',
    ],
    tip: 'Fă-l chiar dacă ești grăbit — varianta de 30 de secunde tot contează, mai bine decât s-o sari complet. Dacă nu poți fi desculț (birou, frig), vizualizarea singură funcționează. Leagă-l de un obicei deja existent (de exemplu, imediat cum te dai jos din pat) — se automatizează mai repede.',
    exemplu: 'Dimineața, înainte de cafea, stai lângă fereastră cu tălpile goale pe podea. Îți iei 3 respirații și simți, poate pentru prima dată conștient, greutatea propriului corp așezată stabil pe sol.',
    shortcut: 'După câteva săptămâni de practică, o singură respirație profundă cu intenția „sunt ancorat" poate declanșa aceeași stare.',
    next: 'Urmează firesc Curățarea energetică. Din săptămâna 2 devine parte din exercițiul Cer-OM-Pământ.',
    theory: ['a-fi-magic'],
  },
  {
    id: 'curatare', title: 'Curățare energetică',
    moment: 'dimineata', pilon: 'Corp', cat: 'Energetic', min: 3, freq: 'zilnic',

function embedOf(url) {
  let m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if (m) return { type: 'iframe', src: `https://www.youtube-nocookie.com/embed/${m[1]}`, link: url };
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { type: 'iframe', src: `https://player.vimeo.com/video/${m[1]}`, link: url };
  if (/\.(mp4|webm|mov|m4v)(\?|#|$)/i.test(url)) return { type: 'video', src: url };
  if (/\.(mp3|m4a|wav|ogg|aac)(\?|#|$)/i.test(url)) return { type: 'audio', src: url };
  return { type: 'link', src: url };
}

  else if (e.type === 'video') player = `<video controls playsinline preload="metadata" src="${esc(e.src)}"></video>`;

/* ---- cronometru ---- */
let timerState = null;
function stopTimer() { if (timerState) { clearInterval(timerState.iv); timerState = null; } }
function beep() {
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.28].forEach((t, i) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = i ? 660 : 523; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + t + 0.03);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + 0.4);
      o.start(ac.currentTime + t); o.stop(ac.currentTime + t + 0.45);
    });
  } catch (e) { /* fără sunet */ }
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { /* ignor */ }
}
const mmss = s => `${Math.floor(s / 60)}:${pad(s % 60)}`;
function toggleTimer(btn) {
  const wrap = btn.closest('.timer'), out = $('.tt', wrap), sec = +wrap.dataset.sec;
  if (timerState) { stopTimer(); out.textContent = mmss(sec); btn.textContent = 'Pornește'; return; }
  const end = Date.now() + sec * 1000;
  btn.textContent = 'Oprește';
  timerState = {
    iv: setInterval(() => {
      const left = Math.max(0, Math.round((end - Date.now()) / 1000));
      out.textContent = mmss(left);
      if (left <= 0) { stopTimer(); btn.textContent = 'Pornește'; out.textContent = 'Gata'; beep(); }
    }, 250),
  };
}

/* ---- instrument: Roata Vieții ---- */
function radarSVG(domains) {
  const n = domains.length, cx = 180, cy = 168, R = 100;
  const pt = (i, v) => { const a = -Math.PI / 2 + i * 2 * Math.PI / n; return [cx + Math.cos(a) * R * v / 10, cy + Math.sin(a) * R * v / 10, a]; };
  let o = '<svg class="radar" viewBox="-40 0 440 340" role="img" aria-label="Roata Vieții">';
  [2, 4, 6, 8, 10].forEach(r => { o += `<polygon class="ring" points="${domains.map((_, i) => pt(i, r).slice(0, 2).map(x => x.toFixed(1)).join(',')).join(' ')}"/>`; });
  domains.forEach((d, i) => {
    const [x, y] = pt(i, 10); o += `<line class="axis" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`;
    const [lx, ly, a] = pt(i, 10 + 1.6 * 10 / 10 * 1.0);
    const tx = cx + Math.cos(a) * (R + 14), ty = cy + Math.sin(a) * (R + 14) + 4;
    const anchor = Math.cos(a) > 0.25 ? 'start' : Math.cos(a) < -0.25 ? 'end' : 'middle';
    const name = d.n.length > 16 ? d.n.slice(0, 15) + '…' : d.n;
    o += `<text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="${anchor}">${esc(name)}</text>`;
  });
  o += `<polygon class="poly" points="${domains.map((d, i) => pt(i, d.v).slice(0, 2).map(x => x.toFixed(1)).join(',')).join(' ')}"/>`;
  domains.forEach((d, i) => { const [x, y] = pt(i, d.v); o += `<circle class="dot" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.4"/>`; });
  return o + '</svg>';
}
function roataTool() {
  const R = S.roata, n = R.domains.length;
  let o = `<div id="radarBox">${radarSVG(R.domains)}</div><div id="domList">`;
  R.domains.forEach((d, i) => {
    o += `<div class="dom"><div class="dom-top"><input type="text" aria-label="Numele domeniului ${i + 1}" data-roata-name="${i}" value="${esc(d.n)}"><span class="dom-v" id="dv${i}">${d.v}</span></div>
      <input type="range" min="0" max="10" step="1" value="${d.v}" aria-label="Scor ${esc(d.n)}" data-roata="${i}">
      <div class="note" id="dn${i}" ${d.v >= 7 ? 'hidden' : ''}><input type="text" placeholder="Ce lipsește aici?" data-bind="roata|domains|${i}|note" value="${esc(d.note || '')}"></div></div>`;
  });
  o += '</div><div class="btns" style="margin-top:12px">';
  if (n < 10) o += '<button class="btn ghost small" data-roata-add>Adaugă domeniu</button>';
  if (n > 8) o += '<button class="btn ghost small" data-roata-del>Șterge ultimul domeniu</button>';
  o += '<button class="btn" data-roata-save>Salvează roata</button></div>';

      if (u.words) o += `<p><b>Detaliul:</b> ${esc(u.words)}${u.why ? ` (${esc(u.why)})` : ''}</p>`;
      QUESTIONS.forEach((q, k) => { if (j['q' + (k + 1)]) o += `<p><b>${esc(q)}</b><br>${esc(j['q' + (k + 1)])}</p>`; });
      const g = [j.g1, j.g2, j.g3].filter(Boolean);
      if (g.length) o += `<p><b>Recunoștință:</b> ${esc(g.join('; '))}</p>`;
      o += '</details>';
    });
    o += '</section>';
  }
  return o;
}

/* ---------- FEEDBACK ---------- */
const RATINGS = [['clar', 'Cât de clare sunt exercițiile?'], ['teorie', 'Cât de utilă ți se pare teoria?'], ['app', 'Cât de ușor e de folosit aplicația?']];
function usageStats() {
  const days = weekDays(), started = days.filter(d => dayDone(d) > 0).length;
  const avg = Math.round(100 * days.reduce((a, d) => a + dayPct(d), 0) / 7);
  const journalDays = days.filter(d => S.journal[d] && Object.values(S.journal[d]).some(Boolean)).length;
  return { started, avg, journalDays, opened: Object.keys(S.stats.opens).length };
}
function feedbackText() {
  const g = S.fb.gen, u = usageStats();
  let t = `Feedback Papillon, săptămâna 1 (${CONFIG.version})\nData: ${todayISO()}\n`;
  if (S.profile.name) t += `Nume: ${S.profile.name}\n`;
  t += `\nFolosire: ${u.started} zile cu exerciții bifate din 7, ${u.avg}% din exerciții bifate în medie, ${u.journalDays} zile cu jurnal, ${u.opened} exerciții deschise din ${EX.length}.\n\nEvaluări (1–5):\n`;
  RATINGS.forEach(([k, l]) => { t += `- ${l} ${g[k] || 'fără răspuns'}\n`; });
  if (g.minute) t += `\nTimp zilnic real: ${g.minute} min\n`;
  [['util', 'Ce m-a ajutat cel mai mult'], ['lipsa', 'Ce lipsește'], ['neclar', 'Ce a fost neclar sau greu de folosit']].forEach(([k, l]) => { if (g[k]) t += `\n${l}:\n${g[k]}\n`; });
  const ex = Object.entries(S.fb.ex).filter(([, v]) => v.r || v.c);
  if (ex.length) { t += '\nPe exerciții:\n'; ex.forEach(([id, v]) => { t += `- ${exById(id).title}: ${v.r === 1 ? 'clar' : v.r === -1 ? 'nu prea clar' : ''}${v.c ? ' (' + v.c + ')' : ''}\n`; }); }
  return t;
}
function viewFeedback() {
  const g = S.fb.gen, u = usageStats();
  let o = `<h1>Feedback</h1><p class="muted">Aplicația e în test. Ce îți spui aici ne ajută să o îmbunătățim înainte de următoarele săptămâni.</p>`;
  o += `<div class="summary"><div class="stat"><b>${u.started}</b><span>zile cu exerciții</span></div><div class="stat"><b>${u.avg}%</b><span>exerciții bifate</span></div><div class="stat"><b>${u.journalDays}</b><span>zile cu jurnal</span></div></div>`;
  o += '<section class="card">';
  RATINGS.forEach(([k, l]) => { o += `<label class="f">${l}</label><div class="rate" role="group" aria-label="${l}">${[1, 2, 3, 4, 5].map(n => `<button data-rate="${k}" data-val="${n}" aria-pressed="${g[k] === n}">${n}</button>`).join('')}</div>`; });
  o += `<p class="small muted" style="margin:6px 0 0">1 = deloc, 5 = foarte mult</p>
    <label class="f" for="fm">Cât timp ți-au luat în medie exercițiile zilnice (minute)?</label><input id="fm" type="number" min="0" inputmode="numeric" data-bind="fb|gen|minute" value="${esc(g.minute || '')}">
    <label class="f" for="fu">Ce te-a ajutat cel mai mult?</label><textarea id="fu" rows="3" data-bind="fb|gen|util">${esc(g.util || '')}</textarea>
    <label class="f" for="fl">Ce lipsește?</label><textarea id="fl" rows="3" data-bind="fb|gen|lipsa">${esc(g.lipsa || '')}</textarea>
    <label class="f" for="fn">Ce a fost neclar sau greu de folosit?</label><textarea id="fn" rows="3" data-bind="fb|gen|neclar">${esc(g.neclar || '')}</textarea>
    <div class="btns" style="margin-top:14px"><button class="btn" data-send>${CONFIG.feedbackUrl ? 'Trimite feedback' : 'Copiază feedback-ul'}</button><button class="btn ghost" data-dl>Descarcă fișier</button></div>
    <p class="small muted" style="margin-top:8px">Răspunsurile rămân pe dispozitivul tău până apeși pe trimitere.</p></section>`;
  o += `<section class="card"><h2>Setări</h2><label class="f" for="sn">Numele tău (opțional)</label><input id="sn" type="text" data-bind="profile|name" value="${esc(S.profile.name)}">
    <label class="f" for="ss">Ziua 1 a săptămânii</label><input id="ss" type="date" data-start value="${S.profile.start}">
    <div class="btns" style="margin-top:14px"><button class="btn ghost small" data-toggle-theme>Schimbă tema (luminos / întunecat)</button><button class="btn danger small" data-reset>Șterge toate datele</button></div></section>`;
  if (ADMIN) {
    const ov = Object.keys(S.media).length ? JSON.stringify(S.media, null, 2) : '(nicio modificare locală)';
    o += `<section class="card"><h2>Mod administrator</h2><p class="small muted">Linkurile lipite pe ecranele exercițiilor se salvează doar pe acest dispozitiv. Copiază-le în MEDIA din fișier ca să ajungă la toți clienții.</p><textarea rows="6" readonly aria-label="Linkuri media locale">${esc(ov)}</textarea><div class="btns" style="margin-top:8px"><button class="btn ghost small" data-copy-media>Copiază</button></div></section>`;
  }
  return o;
}

/* ---------- NOTIȚE DE REVIZUIRE (pentru Adela; se opresc cu CONFIG.reviewMode = false) ---------- */
function reviewKey(sec, id) {
  if (sec === 'ex') return id && exById(id) ? 'ex:' + id : 'ex';
  if (sec === 'teorie') return id && thById(id) ? 'th:' + id : 'teorie';
  if (sec === 'jurnal' || sec === 'feedback') return sec;
  return 'azi';
}
function reviewLabel(k) {
  if (k.startsWith('ex:')) { const e = exById(k.slice(3)); return 'Exercițiu: ' + (e ? e.title : k); }
  if (k.startsWith('th:')) { const t = thById(k.slice(3)); return 'Concept: ' + (t ? t.titlu : k); }
  return { azi: 'Ecranul Azi', ex: 'Lista de exerciții', teorie: 'Teorie (prezentare generală)', jurnal: 'Jurnal', feedback: 'Tabul Feedback' }[k] || k;
}
function reviewBox(k) {
  if (!CONFIG.reviewMode) return '';
  const lab = esc(reviewLabel(k));
  return `<section class="review" aria-label="Notițe de revizuire"><h2>Pentru Adela: notițe de revizuire</h2>
    <p class="small">Scrie aici ce ai vrea schimbat la <b>${lab}</b>: conținut, formulări sau formă. Câmpurile acestea dispar după aprobare.</p>
    <textarea rows="4" aria-label="Notițe pentru ${lab}" data-bind="review|${k}">${esc((S.review || {})[k] || '')}</textarea>
    <div class="btns" style="margin-top:10px"><button class="btn small" data-review-send>Trimite toate notițele</button><button class="btn ghost small" data-review-dl>Descarcă</button></div>
    <p class="small" style="margin:8px 0 0">Notițele se salvează pe acest dispozitiv, pagină cu pagină. „Trimite” le adună pe toate într-un singur mesaj.</p></section>`;
}
function reviewText() {
  const r = S.review || {}, keys = Object.keys(r).filter(k => r[k] && r[k].trim());
  let t = `Notițe de revizuire Papillon S1 (${CONFIG.version})\nData: ${todayISO()}\n`;
  if (S.profile.name) t += `De la: ${S.profile.name}\n`;
  if (!keys.length) return t + '\n(nicio notiță)\n';
  keys.forEach(k => { t += `\n== ${reviewLabel(k)} ==\n${r[k].trim()}\n`; });
  return t;
}
async function sendReview() {
  save(); const text = reviewText();
  if (CONFIG.feedbackUrl) { postRemote('review', text, 'Notițele au fost trimise. Mulțumim!'); return; }
  try { if (navigator.share) { await navigator.share({ title: 'Notițe de revizuire Papillon S1', text }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  copyText(text).then(() => toast('Notițele au fost copiate — lipește-le într-un mesaj'));
}
function downloadReview() {
  save(); const blob = new Blob([reviewText()], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `notite-revizuire-papillon-s1-${todayISO()}.txt`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- rutare ---------- */
const NAV = [['azi', 'Azi', 'azi'], ['ex', 'Exerciții', 'ex'], ['teorie', 'Teorie', 'teorie'], ['jurnal', 'Jurnal', 'jurnal'], ['feedback', 'Feedback', 'feedback']];
function route() {
  const [, sec = 'azi', id] = (location.hash || '#/azi').split('/');
  stopTimer();
  let html;
  if (sec === 'ex') html = id ? viewEx(id) : viewExList();
  else if (sec === 'teorie') html = id ? viewTh(id) : viewTeorie();
  else if (sec === 'jurnal') html = viewJurnal();
  else if (sec === 'feedback') html = viewFeedback();
  else html = viewAzi();
  view().innerHTML = html + reviewBox(reviewKey(sec, id));
  $('#nav').innerHTML = NAV.map(([k, l, ic]) => `<a href="#/${k}" ${(sec === k || (k === 'azi' && !NAV.some(n => n[0] === sec))) ? 'aria-current="page"' : ''}>${svg(ic)}<span>${l}</span></a>`).join('');
  document.title = 'Papillon · Săptămâna 1';
}
function rerender() { const y = window.scrollY; route(); window.scrollTo(0, y); }

/* ---------- evenimente ---------- */
function applyTheme(t) {
  const root = document.documentElement;
  if (t) root.setAttribute('data-theme', t); else root.removeAttribute('data-theme');
}
function toggleCheck(id) {
  const c = (S.checks[selDay] = S.checks[selDay] || {}); c[id] = !c[id]; save(); rerender();
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-day],[data-check-btn],[data-once-btn],[data-jtab],[data-timer],[data-rate],[data-exfb],[data-roata-add],[data-roata-del],[data-roata-save],[data-send],[data-dl],[data-toggle-theme],[data-reset],[data-media-save],[data-copy-media],[data-review-send],[data-review-dl]');
  if (!t) return;
  if (t.dataset.day) { selDay = t.dataset.day; rerender(); }
  else if (t.dataset.checkBtn) toggleCheck(t.dataset.checkBtn);
  else if (t.dataset.onceBtn) { S.once[t.dataset.onceBtn] = !S.once[t.dataset.onceBtn]; save(); rerender(); }
  else if (t.dataset.jtab) { jTab = t.dataset.jtab; rerender(); }
  else if (t.hasAttribute('data-timer')) toggleTimer(t);
  else if (t.dataset.rate) { S.fb.gen[t.dataset.rate] = +t.dataset.val; save(); rerender(); }
  else if (t.dataset.exfb) { const o = (S.fb.ex[t.dataset.exfb] = S.fb.ex[t.dataset.exfb] || {}); o.r = o.r === +t.dataset.val ? 0 : +t.dataset.val; save(); rerender(); }
  else if (t.hasAttribute('data-roata-add')) { S.roata.domains.push({ n: 'Domeniu nou', v: 5, note: '' }); save(); rerender(); }
  else if (t.hasAttribute('data-roata-del')) { S.roata.domains.pop(); save(); rerender(); }
  else if (t.hasAttribute('data-roata-save')) {
    S.roata.savedAt = todayISO(); S.roata.history.push({ d: S.roata.savedAt, v: S.roata.domains.map(d => ({ n: d.n, v: d.v })) });
    S.once.roata = true; save(); rerender(); toast('Roata a fost salvată');
  }
  else if (t.hasAttribute('data-review-send')) sendReview();
  else if (t.hasAttribute('data-review-dl')) downloadReview();
  else if (t.hasAttribute('data-send')) sendFeedback();
  else if (t.hasAttribute('data-dl')) downloadFeedback();
  else if (t.hasAttribute('data-toggle-theme')) {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('papapp_theme', nx); } catch (e) { /* ignor */ } applyTheme(nx);
  }
  else if (t.hasAttribute('data-reset')) {
    if (confirm('Ștergi toate datele de pe acest dispozitiv? Nu se poate anula.')) { try { localStorage.removeItem(KEY); } catch (e) { /* ignor */ } location.hash = '#/azi'; location.reload(); }
  }
  else if (t.dataset.mediaSave) {
    const inp = $(`[data-media-in="${t.dataset.mediaSave}"]`); const v = inp.value.trim();
    if (v) S.media[t.dataset.mediaSave] = v; else delete S.media[t.dataset.mediaSave];
    save(); rerender(); toast('Link salvat local');
  }
  else if (t.hasAttribute('data-copy-media')) copyText(JSON.stringify(S.media, null, 2)).then(() => toast('Copiat'));
});
document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.seg')) { ev.preventDefault(); selDay = ev.target.dataset.day; rerender(); }
});
document.addEventListener('change', ev => {
  const el = ev.target;
  if (el.matches('[data-check]')) toggleCheck(el.dataset.check);
  else if (el.matches('[data-th]')) { const [id, k] = el.dataset.th.split('|'); (S.theory[id] = S.theory[id] || {})[k] = el.checked; save(); rerender(); }
  else if (el.matches('[data-once]')) { S.once[el.dataset.once] = el.checked; save(); rerender(); }
  else if (el.matches('[data-day-pick]')) { selDay = el.value; rerender(); }
  else if (el.matches('[data-start]')) { if (el.value) { S.profile.start = el.value; initSelDay(); save(); toast('Data de start a fost schimbată'); } }
  else if (el.matches('select[data-bind]')) { setPath(el.dataset.bind, el.value); save(); }
});
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.matches('input[data-bind],textarea[data-bind]')) { setPath(el.dataset.bind, el.value); saveSoon(); }
  else if (el.matches('[data-roata]')) {
    const i = +el.dataset.roata, v = +el.value; S.roata.domains[i].v = v;
    $('#dv' + i).textContent = v; $('#dn' + i).hidden = v >= 7;
    $('#radarBox').innerHTML = radarSVG(S.roata.domains); saveSoon();
  } else if (el.matches('[data-roata-name]')) {
    S.roata.domains[+el.dataset.roataName].n = el.value; $('#radarBox').innerHTML = radarSVG(S.roata.domains); saveSoon();
  }
});

async function copyText(t) {
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e2) { /* ignor */ } ta.remove(); return true;
  }
}
/* trimite textul către scriptul Apps Script (Sheet + email către Andrei și Adela) */
let sending = false;
function postRemote(type, text, okMsg) {
  if (sending) return Promise.resolve(); sending = true;
  const btns = $$('[data-send],[data-review-send]'); btns.forEach(b => { b.disabled = true; });
  const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  return new Promise(resolve => {
    let done = false, iframe, form, timer;
    const finish = (ok, why) => {
      if (done) return; done = true; clearTimeout(timer); window.removeEventListener('message', onMsg);
      if (iframe) iframe.remove(); if (form) form.remove();
      sending = false; btns.forEach(b => { b.disabled = false; });
      if (ok) toast(okMsg, 3500);
      else copyText(text).then(() => toast('Nu s-a putut trimite (' + why + '). Textul e copiat — îl poți lipi într-un mesaj.', 9000));
      resolve(ok);
    };
    const onMsg = ev => { const d = ev.data; if (d && d.papillon === id) finish(!!d.ok, d.error || 'respins de script'); };
    window.addEventListener('message', onMsg);
    iframe = document.createElement('iframe'); iframe.name = 'pap_fb_' + id; iframe.hidden = true; iframe.title = 'trimitere';
    form = document.createElement('form'); form.method = 'POST'; form.action = CONFIG.feedbackUrl; form.target = iframe.name; form.hidden = true;
    const inp = document.createElement('input'); inp.type = 'hidden'; inp.name = 'payload';
    inp.value = JSON.stringify({ id, type, version: CONFIG.version, name: S.profile.name || '', text });
    form.appendChild(inp); document.body.appendChild(iframe); document.body.appendChild(form);
    timer = setTimeout(() => finish(false, 'fără răspuns de la script'), 25000);
    form.submit();
  });
}
function sendFeedback() {
  save(); const text = feedbackText();
  if (CONFIG.feedbackUrl) postRemote('feedback', text, 'Feedback trimis. Mulțumim!');
  else copyText(text).then(() => toast('Feedback copiat — lipește-l într-un mesaj'));
}
function downloadFeedback() {
  save(); const blob = new Blob([feedbackText()], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `feedback-papillon-s1-${todayISO()}.txt`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* ---------- pornire ---------- */
function welcome() {
  const d = $('#welcome');
  d.innerHTML = `<div class="dlg"><h2>Bun venit în Papillon</h2>
    <p>Aici găsești într-un singur loc exercițiile săptămânii 1, teoria din spatele lor, jurnalul de seară și, pe măsură ce sosesc, înregistrările audio și videoclipurile Adelei.</p>
    <p class="small muted">Aceasta este o versiune de test. Notele tale rămân doar pe acest dispozitiv, iar la final îți cerem părerea în tabul Feedback.</p>
    <label class="f" for="wn">Cum te cheamă? (opțional)</label><input id="wn" type="text" autocomplete="given-name">
    <label class="f" for="ws">Ziua 1 a săptămânii</label><input id="ws" type="date" value="${S.profile.start}">
    <div class="btns" style="margin-top:16px"><button type="button" class="btn" id="wgo">Începem</button></div></div>`;
  d.hidden = false;
  $('#wgo').addEventListener('click', () => {
    S.profile.name = $('#wn').value.trim(); S.profile.start = $('#ws').value || todayISO(); S.profile.done = true;
    d.hidden = true; d.innerHTML = ''; initSelDay(); save(); route(); window.scrollTo(0, 0);
  });
}

(function boot() {
  let th = null; try { th = localStorage.getItem('papapp_theme'); } catch (e) { /* ignor */ }
  if (th === 'dark' || th === 'light') applyTheme(th);
  S.stats.sessions = (S.stats.sessions || 0) + 1; save();
  initSelDay();
  if (CONFIG.reviewMode) $('.testbadge').textContent = 'versiune pentru revizuire';
  $('#themeBtn').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark'; try { localStorage.setItem('papapp_theme', nx); } catch (e) { /* ignor */ } applyTheme(nx);
  });
  window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });
  route();
  if (!S.profile.done) welcome();
})();
